<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <title>Snap | Intro with dropdown navigation</title>
</head>
<body>
  <header class="header">
    <div class="nav">
      <div class="nav__brand">
        <img src="images/logo.svg" alt="Snap logo" class="nav__logo">
        <button class="nav__toggle" type="button" aria-expanded="false" aria-controls="nav-menu" data-drawer-open>
          <img src="images/icon-menu.svg" alt="Open navigation">
        </button>
      </div>

      <div class="nav__menu" id="nav-menu" data-menu>
        <button class="nav__close" type="button" aria-label="Close navigation" data-drawer-close>
          <img src="images/icon-close-menu.svg" alt="">
        </button>
        <div class="nav__links">
          <div class="dropdown">
            <button class="dropdown__toggle" type="button" aria-expanded="false" aria-controls="features-menu" data-dropdown-toggle="features-menu">
              <span>Features</span>
              <img class="dropdown__arrow" src="images/icon-arrow-down.svg" alt="">
            </button>
            <div class="dropdown__menu" id="features-menu" hidden>
              <a class="dropdown__item" href="#">
                <img src="images/icon-todo.svg" alt="">
                <span>Todo List</span>
              </a>
              <a class="dropdown__item" href="#">
                <img src="images/icon-calendar.svg" alt="">
                <span>Calendar</span>
              </a>
              <a class="dropdown__item" href="#">
                <img src="images/icon-reminders.svg" alt="">
                <span>Reminders</span>
              </a>
              <a class="dropdown__item" href="#">
                <img src="images/icon-planning.svg" alt="">
                <span>Planning</span>
              </a>
            </div>
          </div>

          <div class="dropdown">
            <button class="dropdown__toggle" type="button" aria-expanded="false" aria-controls="company-menu" data-dropdown-toggle="company-menu">
              <span>Company</span>
              <img class="dropdown__arrow" src="images/icon-arrow-down.svg" alt="">
            </button>
            <div class="dropdown__menu" id="company-menu" hidden>
              <a class="dropdown__item" href="#">History</a>
              <a class="dropdown__item" href="#">Our Team</a>
              <a class="dropdown__item" href="#">Blog</a>
            </div>
          </div>

          <a class="nav__link" href="#">Careers</a>
          <a class="nav__link" href="#">About</a>
        </div>

        <div class="nav__auth">
          <a class="nav__auth-link" href="#">Login</a>
          <a class="nav__auth-button" href="#">Register</a>
        </div>
      </div>
    </div>
    <div class="nav__backdrop" data-backdrop></div>
  </header>

  <main class="hero">
    <div class="hero__grid">
      <div class="hero__image">
        <picture>
          <source media="(min-width: 900px)" srcset="images/image-hero-desktop.png">
          <img src="images/image-hero-mobile.png" alt="Remote worker using a laptop">
        </picture>
      </div>
      <div class="hero__content">
        <h1>Make remote work</h1>
        <p>
          Get your team in sync, no matter your location. Streamline processes, create team rituals,
          and watch productivity soar.
        </p>
        <a class="hero__cta" href="#">Learn more</a>
        <div class="hero__clients">
          <img src="images/client-databiz.svg" alt="Databiz">
          <img src="images/client-audiophile.svg" alt="Audiophile">
          <img src="images/client-meet.svg" alt="Meet">
          <img src="images/client-maker.svg" alt="Maker">
        </div>
      </div>
    </div>
  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank" rel="noreferrer">Frontend Mentor</a>.
    Coded by <a href="https://github.com/">Your Name Here</a>.
  </footer>

  <script src="script.js"></script>
</body>
</html>
